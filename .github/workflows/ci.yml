name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          # Build-time placeholders only; real values live in the deploy environment.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SESSION_SECRET: ci-placeholder-session-secret-32-characters-long
          ACTION_LINK_SECRET: ci-placeholder-action-secret-32-characters-long
          CRON_SECRET: ci-placeholder-cron-secret
